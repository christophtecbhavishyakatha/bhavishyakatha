<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhavishya Katha - Download App</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #4b1d8f 0%, #7b2ff7 50%, #f7971e 100%);
    padding: 20px;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    max-width: 420px;
    width: 100%;
    padding: 40px 30px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.3);
  }
  .icon {
    width: 90px;
    height: 90px;
    margin: 0 auto 20px;
    background: linear-gradient(135deg, #7b2ff7, #f7971e);
    border-radius: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 42px;
  }
  h1 {
    font-size: 24px;
    color: #2d1b4e;
    margin-bottom: 8px;
  }
  p.subtitle {
    color: #666;
    font-size: 15px;
    margin-bottom: 28px;
    line-height: 1.5;
  }
  .download-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #000;
    color: #fff;
    text-decoration: none;
    padding: 14px 28px;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    width: 100%;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .download-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.25);
  }
  .download-btn svg {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }
  .btn-text {
    text-align: left;
    line-height: 1.2;
  }
  .btn-text .small {
    font-size: 11px;
    opacity: 0.85;
    display: block;
  }
  .btn-text .big {
    font-size: 17px;
    font-weight: 700;
  }
  footer {
    margin-top: 24px;
    font-size: 12px;
    color: #999;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">🔮</div>
    <h1>Bhavishya Katha</h1>
    <p class="subtitle">Discover your future with astrology insights. Download the app now and get started.</p>

    <a class="download-btn" href="https://play.google.com/store/apps/details?id=com.snsrk9.astrocristoptec" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 512 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
        <path d="M325.3 234.3L104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6l-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/>
      </svg>
      <span class="btn-text">
        <span class="small">DOWNLOAD FROM</span>
        <span class="big">Google Play Store</span>
      </span>
    </a>

    <footer>Available on Android devices</footer>
  </div>
</body>
</html>
